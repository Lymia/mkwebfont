[package]
name = "mkwebfont_common"
version = "0.6.1"
authors = ["Lymia Kanokawa <lymia@lymia.moe>"]
edition = "2021"

description = "Internal crate for mkwebfont."
repository = "https://github.com/Lymia/mkwebfont"

license = "Apache-2.0"
readme = "README.md"

[features]
appimage = []

[dependencies]
blake3 = { version = "1.5", features = ["pure"] }
wyrand = { version = "=0.3.2", features = ["wyhash"] } # low usage crate, pin version

# Used for downloading packages from the internet.
directories = { version = "6.0" }
ureq = { version = "3.1" }

# Common Dependencies
anyhow = { workspace = true }
brotli = { workspace = true }
rkyv = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
