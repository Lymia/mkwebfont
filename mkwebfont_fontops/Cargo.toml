[package]
name = "mkwebfont_fontops"
version = "0.5.2"
authors = ["Rimi Kanokawa <rimi@rimin.moe>"]
edition = "2024"

description = "Internal crate for mkwebfont."
repository = "https://github.com/Lymia/mkwebfont"

license = "Apache-2.0"
readme = "README.md"

include = [
    "src",
    "LICENSE-APACHE",
    "build.rs",
    "contrib/woff2/include",
    "contrib/woff2/src",
    "contrib/woff2/brotli/c/include",
    "contrib/woff_wrapper",
]

[dependencies]
# Unicode data
unicode-blocks = { workspace = true }

# Common Dependencies
anyhow = { workspace = true }
brotli = { workspace = true }
enumset = { workspace = true }
rkyv = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Subcrates
mkwebfont_common = { workspace = true }
mkwebfont_hb-subset = { workspace = true }

[dev-dependencies]
chrono = "0.4"
git2 = { version = "0.20", default-features = false }

# Serde-related
serde = { workspace = true }
toml = "0.9"

# Unicode data
unicode-properties = { workspace = true }

# Common Dependencies
glob = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cc = { workspace = true }
